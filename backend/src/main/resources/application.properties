server.port=8000

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Airtable
airtable.client-id=${AIRTABLE_CLIENT_ID:YOUR_AIRTABLE_CLIENT_ID}
airtable.client-secret=${AIRTABLE_CLIENT_SECRET:YOUR_AIRTABLE_CLIENT_SECRET}

# Notion
notion.client-id=${NOTION_CLIENT_ID:YOUR_NOTION_CLIENT_ID}
notion.client-secret=${NOTION_CLIENT_SECRET:YOUR_NOTION_CLIENT_SECRET}

# HubSpot
hubspot.client-id=${HUBSPOT_CLIENT_ID:YOUR_HUBSPOT_CLIENT_ID}
hubspot.client-secret=${HUBSPOT_CLIENT_SECRET:YOUR_HUBSPOT_CLIENT_SECRET}

# Stripe Connect
stripe.client-id=${STRIPE_CLIENT_ID:YOUR_STRIPE_CLIENT_ID}
stripe.api-key=${STRIPE_API_KEY:YOUR_STRIPE_API_KEY}

# -------------------------------------------------------------------
# Resilience4j — circuit breaker on outbound API calls
# -------------------------------------------------------------------
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.airtable.base-config=default
resilience4j.circuitbreaker.instances.notion.base-config=default
resilience4j.circuitbreaker.instances.hubspot.base-config=default
resilience4j.circuitbreaker.instances.stripe.base-config=default

# Resilience4j — retry with exponential backoff
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2

resilience4j.retry.instances.airtable.base-config=default
resilience4j.retry.instances.notion.base-config=default
resilience4j.retry.instances.hubspot.base-config=default
resilience4j.retry.instances.stripe.base-config=default
